mixed-port: 7890
allow-lan: false
mode: rule
find-process-mode: strict
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#Proxy
  - https://dns.google/dns-query#Proxy
  nameserver-policy:
    geosite:cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    +.cn:
    - https://doh.pub/dns-query
    geosite:anthropic:
    - https://1.1.1.1/dns-query#k-vps
    +.claude.ai:
    - https://1.1.1.1/dns-query#k-vps
    +.claude.com:
    - https://1.1.1.1/dns-query#k-vps
    +.claudeusercontent.com:
    - https://1.1.1.1/dns-query#k-vps
    +.openai.com:
    - https://1.1.1.1/dns-query#k-vps
    +.chatgpt.com:
    - https://1.1.1.1/dns-query#k-vps
    +.oaistatic.com:
    - https://1.1.1.1/dns-query#k-vps
    +.oaiusercontent.com:
    - https://1.1.1.1/dns-query#k-vps
    +.google.com:
    - https://1.1.1.1/dns-query#k-vps
    +.googleapis.com:
    - https://1.1.1.1/dns-query#k-vps
    +.gstatic.com:
    - https://1.1.1.1/dns-query#k-vps
    +.googleusercontent.com:
    - https://1.1.1.1/dns-query#k-vps
    +.googletagmanager.com:
    - https://1.1.1.1/dns-query#k-vps
    +.google-analytics.com:
    - https://1.1.1.1/dns-query#k-vps
  proxy-server-nameserver:
  - https://doh.pub/dns-query
proxies:
- name: k-vps
  type: vless
  server: 203.0.113.10
  port: 443
  uuid: YOUR_UUID
  network: tcp
  udp: true
  tls: true
  flow: xtls-rprx-vision
  servername: YOUR_SNI
  client-fingerprint: chrome
  reality-opts:
    public-key: YOUR_REALITY_PUBLIC_KEY
    short-id: YOUR_REALITY_SHORT_ID
- name: k-vps-resi
  type: vless
  server: 203.0.113.10
  port: 8444
  uuid: YOUR_UUID
  network: tcp
  udp: true
  tls: true
  flow: xtls-rprx-vision
  servername: YOUR_SNI
  client-fingerprint: chrome
  reality-opts:
    public-key: YOUR_REALITY_PUBLIC_KEY
    short-id: YOUR_REALITY_SHORT_ID
- name: k-vps-hy2
  type: hysteria2
  server: 203.0.113.10
  port: 8443
  password: YOUR_HY2_PASSWORD
  sni: YOUR_SNI
  alpn:
  - h3
  skip-cert-verify: true
  up: '100'
  down: '500'
proxy-groups:
- name: Proxy
  type: select
  proxies:
  - k-vps
  - k-vps-hy2
  - k-vps-resi
  - 自动选择
  - DIRECT
- name: 自动选择
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  proxies:
  - k-vps
  - k-vps-hy2
rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR,203.0.113.10/32,DIRECT,no-resolve
- AND,((PROCESS-NAME,claude),(NETWORK,UDP)),REJECT
- PROCESS-NAME,claude,k-vps-resi
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,anthropic.com)),REJECT
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,claude.ai)),REJECT
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,claude.com)),REJECT
- AND,((NETWORK,UDP),(DOMAIN-SUFFIX,clau.de)),REJECT
