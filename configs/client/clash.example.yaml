- DOMAIN-SUFFIX,anthropic.com,k-vps-resi
- DOMAIN-SUFFIX,claude.ai,k-vps-resi
- DOMAIN-SUFFIX,claude.com,k-vps-resi
- DOMAIN-SUFFIX,clau.de,k-vps-resi
- DOMAIN-SUFFIX,claudemcpclient.com,k-vps-resi
- DOMAIN-SUFFIX,claudemcpcontent.com,k-vps-resi
- DOMAIN-SUFFIX,claudeusercontent.com,k-vps-resi
